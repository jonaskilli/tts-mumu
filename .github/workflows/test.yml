name: 编译验证

on:
  push:
    branches: [ mumu_tts_github ]
    paths:
      - 'lib-script/**'
      - 'lib-tts/**'
      - 'lib-common/**'
      - 'lib-compose/**'
      - 'lib-database/**'
      - 'app/src/**'
      - 'app/build.gradle'
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Check
        run: |
          chmod +x gradlew
          ./gradlew compileAppDebugKotlin --build-cache --parallel --daemon --warning-mode all
