name: Build Release

on:
  # ui 分支专用: 只打 UI 预览版 (包名 .ui 结尾), 以 ui- 前缀 tag 发布为预发布,
  # 与 mumu_tts_github 分支发布的正式包完全隔离, 不会出现在 Release 最新列表。
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      product: ui
      outputs_dir: "${{ github.workspace }}/app/build/outputs"
      ver_name: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Init Signature
        run: |
          touch local.properties
          echo ALIAS_NAME='${{ secrets.ALIAS_NAME }}' >> local.properties
          echo ALIAS_PASSWORD='${{ secrets.ALIAS_PASSWORD }}' >> local.properties
          echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' >> local.properties
          echo KEY_PATH='./key.jks' >> local.properties
          if [ -z "${{ secrets.KEY_STORE }}" ]; then
            echo "::error::Secret KEY_STORE 未配置, 请到 Settings > Secrets > Actions 添加 key.jks 的 Base64 编码"
            exit 1
          fi
          if [ -z "${{ secrets.ALIAS_NAME }}" ] || [ -z "${{ secrets.ALIAS_PASSWORD }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::签名 Secrets (ALIAS_NAME/ALIAS_PASSWORD/KEY_PASSWORD) 未完整配置"
            exit 1
          fi
          printf '%s' '${{ secrets.KEY_STORE }}' | base64 --decode > $GITHUB_WORKSPACE/app/key.jks
          file $GITHUB_WORKSPACE/app/key.jks
          ls -l $GITHUB_WORKSPACE/app/key.jks

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleUiRelease --build-cache --parallel --daemon --warning-mode all

      - name: Init environment variable
        run: |
          echo "ver_name=$(grep -m 1 'versionName' ${{ env.outputs_dir }}/apk/${{ env.product }}/release/output-metadata.json | cut -d\" -f4)" >> $GITHUB_ENV

      - name: Save version name
        run: echo "${{ env.ver_name }}" > ver_name_${{ env.product }}.txt

      - name: Upload Mappings to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mappings_${{ env.product }}_${{ env.ver_name }}
          path: ${{ env.outputs_dir }}/mapping/*/*.txt
          retention-days: 1

      - name: Upload APK To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "TTS-Server_${{ env.product }}_${{ env.ver_name }}"
          path: |
            ${{env.outputs_dir}}/apk/${{ env.product }}/release/*.apk
            ver_name_${{ env.product }}.txt
          retention-days: 1

  release:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version from ui build
        run: |
          VER=$(cat artifacts/TTS-Server_ui_*/ver_name_ui.txt)
          echo "release_name=UI预览版 $VER" >> $GITHUB_ENV
          echo "release_tag=ui-$VER" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.release_name }}
          tag_name: ${{ env.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: true
          files: artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete artifacts to free storage
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            for (const a of artifacts.data.artifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: a.id
              });
            }
