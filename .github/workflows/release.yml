name: Build Release

on:
  # 测试阶段: 去掉 push 自动触发, 避免与 test.yml 重复打包。
  # 只保留手动触发, 需要发正式 Release 时再在 Actions 页面手动运行。
  workflow_dispatch:
    inputs:
      build_dev:
        description: "同时构建 dev 共存版 (默认同时构建 app 和 dev)"
        type: boolean
        default: true
      build_ui:
        description: "构建 ui 预览版 (包名 com.github.jing332.tts_server_android.ui)"
        type: boolean
        default: true

jobs:
  build:
    strategy:
      matrix:
        # 动态生成: build_dev=true 时含 "dev", build_ui=true 时含 "ui"; 始终含 "app"
        product: ${{ fromJSON(format('["app"{0}{1}]', github.event.inputs.build_dev == 'true' && ',"dev"' || '', github.event.inputs.build_ui == 'true' && ',"ui"' || '')) }}

      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      product: ${{ matrix.product }}
      outputs_dir: "${{ github.workspace }}/app/build/outputs"
      ver_name: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Init Signature
        run: |
          touch local.properties
          echo ALIAS_NAME='${{ secrets.ALIAS_NAME }}' >> local.properties
          echo ALIAS_PASSWORD='${{ secrets.ALIAS_PASSWORD }}' >> local.properties
          echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' >> local.properties
          echo KEY_PATH='./key.jks' >> local.properties
          if [ -z "${{ secrets.KEY_STORE }}" ]; then
            echo "::error::Secret KEY_STORE 未配置, 请到 Settings > Secrets > Actions 添加 key.jks 的 Base64 编码"
            exit 1
          fi
          if [ -z "${{ secrets.ALIAS_NAME }}" ] || [ -z "${{ secrets.ALIAS_PASSWORD }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::签名 Secrets (ALIAS_NAME/ALIAS_PASSWORD/KEY_PASSWORD) 未完整配置"
            exit 1
          fi
          printf '%s' '${{ secrets.KEY_STORE }}' | base64 --decode > $GITHUB_WORKSPACE/app/key.jks
          file $GITHUB_WORKSPACE/app/key.jks
          ls -l $GITHUB_WORKSPACE/app/key.jks
          if [ ! -s $GITHUB_WORKSPACE/app/key.jks ]; then
            echo "::error::解码后的 key.jks 为空文件, 请检查 KEY_STORE Base64 是否正确"
            exit 1
          fi

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assemble${{ env.product }}release --build-cache --parallel --daemon --warning-mode all

      - name: Init environment variable
        run: |
          echo "ver_name=$(grep -m 1 'versionName' ${{ env.outputs_dir }}/apk/${{ env.product }}/release/output-metadata.json | cut -d\" -f4)" >> $GITHUB_ENV

      - name: Save version name
        run: echo "${{ env.ver_name }}" > ver_name_${{ env.product }}.txt

      - name: Upload Mappings to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mappings_${{ env.product }}_${{ env.ver_name }}
          path: ${{ env.outputs_dir }}/mapping/*/*.txt
          retention-days: 1

      - name: Upload APK To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "TTS-Server_${{ env.product }}_${{ env.ver_name }}"
          path: |
            ${{env.outputs_dir}}/apk/${{ env.product }}/release/*.apk
            ver_name_${{ env.product }}.txt
          retention-days: 1

  release:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # 删除 artifact 需要
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version from app build
        run: |
          VER=$(cat artifacts/TTS-Server_app_*/ver_name_app.txt)
          echo "ver_name=$VER" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.ver_name }}
          tag_name: ${{ env.ver_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete artifacts to free storage
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            for (const a of artifacts.data.artifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: a.id
              });
              core.info(`已删除 artifact: ${a.name}`);
            }
