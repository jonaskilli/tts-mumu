name: Build Debug

on:
  # 手动触发，需要 debug 包时在 Actions 页面运行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      outputs_dir: "${{ github.workspace }}/app/build/outputs"
      ver_name: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleAppdebug --build-cache --parallel --daemon --warning-mode all

      - name: Init environment variable
        run: |
          echo "ver_name=$(grep -m 1 'versionName' ${{ env.outputs_dir }}/apk/app/debug/output-metadata.json | cut -d\" -f4)" >> $GITHUB_ENV

      - name: Save version name
        run: echo "${{ env.ver_name }}" > ver_name_app.txt

      - name: Upload APK To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "TTS-Server-Debug_${{ env.ver_name }}"
          path: |
            ${{env.outputs_dir}}/apk/app/debug/*.apk
            ver_name_app.txt
          retention-days: 7
