name: Build Debug

on:
  # 手动触发，需要 debug 包时在 Actions 页面运行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      outputs_dir: "${{ github.workspace }}/app/build/outputs"
      ver_name: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Init Signature
        # app 的 debug 变体复用 signingConfigs.release；若不注入 local.properties，它会回退到
        # ~/.android/debug.keystore，而 runner 上该文件不存在，只能现场 keytool 生成 —— 每次构建
        # 密钥都不同，debug 包之间无法覆盖安装（同一 applicationId 换签名 = 必须卸载重装）。
        # 这里注入与正式版相同的密钥，让 debug 包签名固定下来。
        # 安全上无碍：debug 变体 applicationId 带 .debug 后缀，与正式版是两个独立应用。
        run: |
          touch local.properties
          echo ALIAS_NAME='${{ secrets.ALIAS_NAME }}' >> local.properties
          echo ALIAS_PASSWORD='${{ secrets.ALIAS_PASSWORD }}' >> local.properties
          echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' >> local.properties
          echo KEY_PATH='./key.p12' >> local.properties
          if [ -z "${{ secrets.KEY_STORE }}" ]; then
            echo "::error::Secret KEY_STORE 未配置, 请到 Settings > Secrets > Actions 添加 key.p12 的 Base64 编码"
            exit 1
          fi
          printf '%s' '${{ secrets.KEY_STORE }}' | base64 --decode > $GITHUB_WORKSPACE/app/key.p12
          if [ ! -s $GITHUB_WORKSPACE/app/key.p12 ]; then
            echo "::error::解码后的 key.p12 为空文件, 请检查 KEY_STORE Base64 是否正确"
            exit 1
          fi
          keytool -list -keystore $GITHUB_WORKSPACE/app/key.p12 -storetype PKCS12 \
            -storepass '${{ secrets.KEY_PASSWORD }}' -alias '${{ secrets.ALIAS_NAME }}' > /dev/null \
            || { echo "::error::keystore 读取失败: 请核对 KEY_STORE / KEY_PASSWORD / ALIAS_NAME"; exit 1; }

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleAppdebug --build-cache --parallel --daemon --warning-mode all

      - name: Init environment variable
        run: |
          echo "ver_name=$(grep -m 1 'versionName' ${{ env.outputs_dir }}/apk/app/debug/output-metadata.json | cut -d\" -f4)" >> $GITHUB_ENV

      - name: Save version name
        run: echo "${{ env.ver_name }}" > ver_name_app.txt

      - name: Upload APK To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "U-TTS-Server-Debug_${{ env.ver_name }}"
          path: |
            ${{env.outputs_dir}}/apk/app/debug/*.apk
            ver_name_app.txt
          retention-days: 7
