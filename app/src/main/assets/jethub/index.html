<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jet Hub</title>
<!-- 手机适配层：dsh-phone.css 是官方手机适配层（原样复用，窄屏把侧栏折成
     切换面板的基线样式）；jet-phone.css 是本仓融合版覆盖层，把侧栏改成
     页面顶部常驻的「小图标选择条」，账号面板直接显示在下方（2026-10-10） -->
<link rel="stylesheet" href="dsh-phone.css">
<link rel="stylesheet" href="jet-phone.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fafbfc; }
  #jh-root { height: 100%; }
  /* 手机适配层需要页面自身是窄屏场景；插件样式在 body 上加 dsh-phone-mobile */
  body { -webkit-text-size-adjust: 100%; }
</style>
</head>
<body>
<div id="jh-root"></div>

<script src="jethub-ui.js"></script>
<script>
// ---- Kotlin 桥：rpcCall(endpoint, payload) → Promise(结果值)，失败 reject ----
// 与插件 index.js 里的 rpcCall 契约一致（返回解包后的值，不是 {ok,...} 信封）。
(function () {
  var seq = 0;
  var pending = {};
  window.__jhPending = pending;
  window.__jhRpc = function (callId, json) {
    var p = pending[callId];
    if (!p) return;
    delete pending[callId];
    try {
      var r = JSON.parse(json);
      if (r && r.ok) p.resolve(r.value);
      else p.reject(new Error((r && r.error) || 'rpc failed'));
    } catch (e) { p.reject(e); }
  };
  function nativeRpc(endpoint, payload) {
    return new Promise(function (resolve, reject) {
      var callId = 'c' + (++seq);
      pending[callId] = { resolve: resolve, reject: reject };
      try {
        AndroidBridge.rpc(callId, endpoint, JSON.stringify(payload || {}));
      } catch (e) {
        delete pending[callId];
        reject(e);
      }
    });
  }
  function boot() {
    JetHubUI.mount(document.getElementById('jh-root'), {
      rpcCall: nativeRpc,
      onClose: function () { try { AndroidBridge.close(); } catch (e) {} }
    });
  }
  // 系统返回键桥（10-10 返回链排查）：插件弹窗在桌面端靠 ESC 关闭（jet-hub.js
  // 各弹窗在 document 上监听 keydown Escape），手机没有 ESC——不拦的话弹窗开着
  // 按系统返回会连 Jet 页一起退。宿主按返回先调这里：有弹窗
  // （.dim-jh-modalOverlay）就注入 Escape 让插件自己关、返回 true；没弹窗返回
  // false，宿主据此才真正退页。兜底：个别弹窗不认 ESC 时轮询三次仍关不掉就
  // AndroidBridge.close() 退页，保证一次返回必有响应。
  window.__jhBack = function () {
    if (!document.querySelector('.dim-jh-modalOverlay')) return false;
    var dispatch = function () {
      try { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); } catch (e) {}
    };
    dispatch();
    var tries = 0;
    var timer = setInterval(function () {
      if (!document.querySelector('.dim-jh-modalOverlay')) { clearInterval(timer); return; }
      if (++tries >= 3) {
        clearInterval(timer);
        try { AndroidBridge.close(); } catch (e) {}
        return;
      }
      dispatch();
    }, 200);
    return true;
  };
  if (window.JetHubUI) boot();
  else window.addEventListener('load', boot);
})();
</script>
<script src="phone-adapt.js"></script>
</body>
</html>
