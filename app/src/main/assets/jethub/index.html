<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jet Hub</title>
<!-- 手机适配层（照 dsh-phone-src/app/src/main/assets/dsh-phone.css，原样复用）：
     把插件原版 UI 的左侧 228px 侧栏，在窄屏下改成「选择供应商」切换面板 -->
<link rel="stylesheet" href="dsh-phone.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fafbfc; }
  #jh-root { height: 100%; }
  /* 手机适配层需要页面自身是窄屏场景；插件样式在 body 上加 dsh-phone-mobile */
  body { -webkit-text-size-adjust: 100%; }
</style>
</head>
<body>
<div id="jh-root"></div>

<script src="jethub-ui.js"></script>
<script>
// ---- Kotlin 桥：rpcCall(endpoint, payload) → Promise(结果值)，失败 reject ----
// 与插件 index.js 里的 rpcCall 契约一致（返回解包后的值，不是 {ok,...} 信封）。
(function () {
  var seq = 0;
  var pending = {};
  window.__jhPending = pending;
  window.__jhRpc = function (callId, json) {
    var p = pending[callId];
    if (!p) return;
    delete pending[callId];
    try {
      var r = JSON.parse(json);
      if (r && r.ok) p.resolve(r.value);
      else p.reject(new Error((r && r.error) || 'rpc failed'));
    } catch (e) { p.reject(e); }
  };
  function nativeRpc(endpoint, payload) {
    return new Promise(function (resolve, reject) {
      var callId = 'c' + (++seq);
      pending[callId] = { resolve: resolve, reject: reject };
      try {
        AndroidBridge.rpc(callId, endpoint, JSON.stringify(payload || {}));
      } catch (e) {
        delete pending[callId];
        reject(e);
      }
    });
  }
  function boot() {
    JetHubUI.mount(document.getElementById('jh-root'), {
      rpcCall: nativeRpc,
      onClose: function () { try { AndroidBridge.close(); } catch (e) {} }
    });
  }
  if (window.JetHubUI) boot();
  else window.addEventListener('load', boot);
})();
</script>
<script src="phone-adapt.js"></script>
</body>
</html>
