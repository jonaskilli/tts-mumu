<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTS Server - OpenAI 格式测试</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  margin: 0; padding: 16px;
  background: #f5f5f5;
}
.container {
  max-width: 600px; margin: 0 auto;
  background: #fff; border-radius: 12px;
  padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
h1 { font-size: 20px; text-align: center; margin-bottom: 20px; color: #333; }
label {
  display: block; margin-top: 14px;
  font-size: 14px; color: #555; font-weight: 500;
}
input, textarea, select {
  width: 100%; margin-top: 6px;
  padding: 10px 12px; font-size: 15px;
  border: 1px solid #ddd; border-radius: 8px;
  outline: none; -webkit-appearance: none;
}
input:focus, textarea:focus, select:focus { border-color: #007aff; }
textarea { height: 80px; resize: vertical; }
.btn {
  display: block; width: 100%; margin-top: 20px;
  padding: 14px; font-size: 16px; font-weight: 600;
  color: #fff; background: #007aff; border: none;
  border-radius: 10px; cursor: pointer;
}
.btn:active { background: #0051d5; }
.btn:disabled { background: #ccc; }
.status {
  margin-top: 16px; padding: 12px; font-size: 14px;
  border-radius: 8px; display: none;
}
.status.info { background: #e3f2fd; color: #1565c0; display: block; }
.status.error { background: #ffebee; color: #c62828; display: block; }
.status.success { background: #e8f5e9; color: #2e7d32; display: block; }
audio { width: 100%; margin-top: 16px; }
.download-link {
  display: block; margin-top: 10px;
  color: #007aff; font-size: 14px; text-align: center;
}
.small { font-size: 12px; color: #999; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
  <h1>TTS Server 语音合成测试</h1>

  <label>服务器地址 (Base URL)</label>
  <input type="text" id="baseUrl" value="http://192.168.1.100:3331" placeholder="如: http://192.168.1.100:3331">
  <div class="small">填 TTS Server 转发器地址，不要加 /v1/audio/speech</div>

  <label>模型 (model)</label>
  <input type="text" id="model" value="tts-1" placeholder="tts-1 或引擎包名">
  <div class="small">填 tts-1、tts-1-hd 或引擎包名（空=默认引擎）</div>

  <label>音色 (voice)</label>
  <input type="text" id="voice" value="" placeholder="留空使用默认音色">
  <div class="small">留空使用默认音色，或填实际音色名</div>

  <label>待合成文本 (input)</label>
  <textarea id="inputText" placeholder="输入要合成的文字...">你好，这是通过 OpenAI 格式接口测试语音合成。</textarea>

  <label>输出格式 (response_format)</label>
  <select id="format">
    <option value="mp3" selected>mp3</option>
    <option value="wav">wav</option>
    <option value="opus">opus</option>
    <option value="aac">aac</option>
    <option value="flac">flac</option>
    <option value="pcm">pcm</option>
  </select>

  <label>语速 (speed)</label>
  <input type="number" id="speed" value="1.0" step="0.1" min="0.25" max="4.0">

  <button class="btn" id="synthesizeBtn" onclick="synthesize()">开始合成</button>

  <div class="status" id="status"></div>

  <audio id="audioPlayer" controls style="display:none;"></audio>
  <a class="download-link" id="downloadLink" style="display:none;" download="speech.mp3">下载音频文件</a>
</div>

<script>
function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

async function synthesize() {
  const baseUrl = document.getElementById('baseUrl').value.trim();
  const model = document.getElementById('model').value.trim();
  const voice = document.getElementById('voice').value.trim();
  const input = document.getElementById('inputText').value.trim();
  const format = document.getElementById('format').value;
  const speed = parseFloat(document.getElementById('speed').value);
  const btn = document.getElementById('synthesizeBtn');
  const audioPlayer = document.getElementById('audioPlayer');
  const downloadLink = document.getElementById('downloadLink');

  if (!baseUrl) { showStatus('请填写服务器地址', 'error'); return; }
  if (!input) { showStatus('请填写待合成文本', 'error'); return; }

  btn.disabled = true;
  showStatus('正在合成，请稍候...', 'info');
  audioPlayer.style.display = 'none';
  downloadLink.style.display = 'none';

  try {
    const url = baseUrl.replace(/\/$/, '') + '/v1/audio/speech';
    const body = {
      model: model || 'tts-1',
      input: input,
      voice: voice,
      response_format: format,
      speed: isNaN(speed) ? 1.0 : speed
    };

    console.log('请求:', url, body);

    const resp = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer sk-test'
      },
      body: JSON.stringify(body)
    });

    console.log('响应状态:', resp.status, resp.statusText);

    if (!resp.ok) {
      const text = await resp.text();
      console.error('响应错误:', text);
      showStatus('合成失败: HTTP ' + resp.status + ' - ' + text.substring(0, 200), 'error');
      btn.disabled = false;
      return;
    }

    const blob = await resp.blob();
    console.log('收到音频:', blob.size, 'bytes, type:', blob.type);

    if (blob.size === 0) {
      showStatus('合成失败: 返回音频为空', 'error');
      btn.disabled = false;
      return;
    }

    const audioUrl = URL.createObjectURL(blob);

    audioPlayer.src = audioUrl;
    audioPlayer.style.display = 'block';
    audioPlayer.play().catch(() => {});

    downloadLink.href = audioUrl;
    downloadLink.download = 'speech.' + format;
    downloadLink.style.display = 'block';

    showStatus('合成成功！音频大小: ' + blob.size + ' bytes', 'success');

  } catch (err) {
    console.error('请求异常:', err);
    showStatus('请求失败: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
