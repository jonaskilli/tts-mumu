# Gradle镜像加速配置（国内）

# 启用配置缓存
org.gradle.caching=true

# 启用并行构建
org.gradle.parallel=true

# 配置JVM内存
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m

# 强制 Kotlin 编译守护进程以 UTF-8 读取源码，避免中文被当成 Latin-1 产生乱码
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8

# Android X
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false
android.enableR8.fullMode=false
android.suppressUnsupportedCompileSdk=36

org.gradle.daemon=true
org.gradle.configureondemand=true
#org.gradle.unsafe.configuration-cache=true
# Use this flag sparingly, in case some of the plugins are not fully compatible
#org.gradle.unsafe.configuration-cache-problems=warn

kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.incremental.js=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true

#kotlin.experimental.tryK2=true
#android.lint.useK2Uast=true
#kapt.incremental.apt=true
#kapt.include.compile.classpath=false

# 配置Gradle插件仓库（阿里云镜像）
pluginManagement {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        google()
        mavenCentral()
    }
}

# 项目级仓库（用于兼容旧版本）
allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        google()
        mavenCentral()
    }
}
